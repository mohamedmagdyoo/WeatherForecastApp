[versions]
agp = "8.13.2"
coilComposeVersion = "2.5.0"
coilSvg = "2.5.0"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"         # Must match kotlin version

# AndroidX Core
coreKtx = "1.17.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.4"
composeBom = "2024.09.00"

# Testing
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# Google Services
places = "4.1.0"
playServicesLocation = "21.3.0"

# WorkManager
playServicesMaps = "19.0.0"
workVersion = "2.11.1"

# Retrofit + Gson --> 3 dependencies (retrofit, converter-gson, gson)
retrofit = "3.0.0"
gson = "2.13.2"               # Note: gson is standalone, converter-gson uses retrofit version

# Room --> 3 dependencies (room-runtime, room-compiler, room-ktx)
# Note: room-compiler must use ksp() not implementation() in build.gradle.kts
roomVersion = "2.8.4"

# Coil
coilCompose = "2.7.0"
#Navigation
nav_version = "2.9.7"
kotlinxSerializationJson = "1.7.3"
kotlinSerialization = "2.0.21"
material3 = "1.4.0"




[libraries]
#Icons
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
coil-compose-v250 = { module = "io.coil-kt:coil-compose", version.ref = "coilComposeVersion" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coilSvg" }
material3 = { module = "androidx.compose.material3:material3" }


# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose BOM --> all compose versions managed by BOM, no version needed on each
# Note: composeBom version controls ui, graphics, tooling, material3, test libraries below
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Testing
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Google Services
places = { module = "com.google.android.libraries.places:places", version.ref = "places" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

# WorkManager --> 1 dependency
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workVersion" }

# Retrofit --> 2 dependencies (retrofit, converter-gson)
# Note: gson is a separate library, not part of retrofit group
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

# Gson --> 1 dependency (standalone JSON library, also used internally by converter-gson)
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Room --> 3 dependencies
# Note: room-compiler must use ksp() in build.gradle.kts, not implementation()
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomVersion" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomVersion" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomVersion" }

# Coil --> 1 dependency (image loading for Compose)
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }

#Navigation
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "nav_version" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Note: ksp version must always start with the same kotlin version (e.g. 2.0.21-x.x.xx)
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

#Navigation
kotlin-navigation = { id = "plugin.serialization", version.ref = "kotlinSerialization" }
